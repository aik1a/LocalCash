plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aik1a.localcash'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'com.aik1a.localcash'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'com.aik1a.localcash.FlowChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}



dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
}

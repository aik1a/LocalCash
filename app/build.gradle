plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aik1a.localcash'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'com.aik1a.localcash'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.2.0'
        testInstrumentationRunner 'com.aik1a.localcash.FlowChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}



dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    implementation 'org.osmdroid:osmdroid-mapsforge:6.1.18'
}



// Data is acquired while building; the installed app remains completely offline.
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/offlineMaps').get().asFile)
android.androidResources.noCompress += ['map']
def prepareOfflineMaps = tasks.register('prepareOfflineMaps') {
    def mapsDirectory = layout.buildDirectory.dir('generated/offlineMaps/maps/vector')
    // These are cached source assets, not disposable generated outputs. Declaring
    // the directory as task output makes Gradle delete an externally restored cache.
    // Validate/reuse the files on every invocation instead.
    doLast {
        def directory = mapsDirectory.get().asFile
        directory.mkdirs()
        def sources = [
            'world.map': 'https://download.mapsforge.org/maps/v5/world/world.map',
            'chile.map': 'https://ftp-stud.hs-esslingen.de/Mirrors/download.mapsforge.org/maps/v5/south-america/chile.map'
        ]
        def valid = { File map ->
            if (!map.isFile() || map.length() < 1000) return false
            try {
                return map.withDataInputStream { input ->
                    byte[] magic = new byte[20]
                    input.readFully(magic)
                    input.readInt() // header size
                    input.readInt() // format version
                    new String(magic, 'US-ASCII') == 'mapsforge binary OSM' && input.readLong() == map.length()
                }
            } catch (IOException ignored) { return false }
        }
        def records = []
        sources.each { name, url ->
            def map = new File(directory, name)
            if (!valid(map)) {
                logger.lifecycle('Preparing offline map: ' + name)
                def partial = new File(directory, name + '.part')
                try {
                    def connection = new URI(url).toURL().openConnection()
                    connection.setConnectTimeout(30000)
                    connection.setReadTimeout(180000)
                    connection.setRequestProperty('User-Agent', 'LocalCash-academic-build/1.2')
                    connection.getInputStream().withCloseable { input ->
                        partial.withOutputStream { output -> output << input }
                    }
                    if (!valid(partial)) throw new GradleException('Incomplete or invalid Mapsforge map: ' + name)
                    java.nio.file.Files.move(partial.toPath(), map.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                } finally { partial.delete() }
            }
            def hash = java.security.MessageDigest.getInstance('SHA-256')
            map.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = input.read(buffer)) != -1) hash.update(buffer, 0, count)
            }
            def checksum = hash.digest().encodeHex().toString()
            new File(directory, name + '.sha256').setText(checksum, 'US-ASCII')
            records.add([name: name, url: url, bytes: map.length(), sha256: checksum])
        }
        new File(directory, 'provenance.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            license: 'ODbL-1.0', attribution: '© OpenStreetMap contributors', maps: records
        ])), 'UTF-8')
        new File(directory, 'LICENSE.txt').setText('Map data © OpenStreetMap contributors, ODbL 1.0.\nhttps://www.openstreetmap.org/copyright\nWorld is a coarse basemap. Chile contains street data. Other countries may be imported locally as .map files.\n', 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn(prepareOfflineMaps) }

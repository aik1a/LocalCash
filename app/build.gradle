plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.aik1a.localcash'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'com.aik1a.localcash'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.1.1'
        testInstrumentationRunner 'com.aik1a.localcash.FlowChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}



dependencies {
    implementation 'com.google.firebase:firebase-firestore:27.2.0'
    implementation 'com.google.firebase:firebase-auth:25.0.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}


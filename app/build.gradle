plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aik1a.localcash'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'com.aik1a.localcash'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.2.0'
        testInstrumentationRunner 'com.aik1a.localcash.FlowChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}



dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    implementation 'org.osmdroid:osmdroid-mapsforge:6.1.18'
}



// Data is acquired while building; the installed app remains completely offline.
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/offlineMaps').get().asFile)
android.androidResources.noCompress += ['map']
def prepareOfflineMaps = tasks.register('prepareOfflineMaps', Exec) {
    commandLine 'python3', rootProject.file('tools/maps/prepare_vector_maps.py')
    inputs.file(rootProject.file('tools/maps/prepare_vector_maps.py'))
    outputs.dir(layout.buildDirectory.dir('generated/offlineMaps'))
}
tasks.named('preBuild').configure { dependsOn(prepareOfflineMaps) }
